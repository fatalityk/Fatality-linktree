<div class="social-row">

      <!-- Pie de página -->

  <!-- 1. Cargar el último vídeo usando la lista de reproducción (NUNCA FALLA) -->
  <script>
    // Asigna la playlist de tus vídeos al iframe
    const iframe = document.getElementById('iframeUltimoVideo');
    if (iframe) {
      iframe.src = "https://www.youtube.com/embed/videoseries?list=UUMerz5hyVZ9qVsQjbdm0lRg";
    }
  </script>

  <!-- 2. Control del botón de música -->
  <script>
    const musica = document.getElementById('musicaFondo');
    const btn = document.getElementById('btnMusica');
    const icono = document.getElementById('iconoMusica');

    if (btn && musica) {
      btn.addEventListener('click', () => {
        if (musica.paused) {
          musica.play().then(() => {
            btn.classList.add('playing');
            icono.className = 'fa-solid fa-volume-high';
          }).catch(err => console.error("Error al reproducir audio:", err));
        } else {
          musica.pause();
          btn.classList.remove('playing');
          icono.className = 'fa-solid fa-music';
        }
      });
    }
  </script>
